name: Deploy guide to GitHub Pages

# The deliverable is built, not committed: build.js inlines
# ews-pathways-data.js into ews-decision-map.src.html, and the result is
# published as index.html. Content edits land in ews-pathways-data.js and
# deploy from there — nobody hand-edits the built file.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the single-file guide
        run: node build.js

      - name: Fail if the build produced nothing
        run: test -s ews-decision-map.html

      - name: Stage the site
        run: |
          mkdir -p _site
          cp ews-decision-map.html _site/index.html
          # Working draft, not yet approved: ask crawlers to stay out.
          # Delete this step when the committee is ready to be found.
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          # Off-grid page in a public repo: also tell crawlers not to index or
          # follow, in the page itself (skipped if the source already has it).
          grep -q 'name="robots"' _site/index.html || \
            sed -i '0,/<meta name="viewport"[^>]*>/s//&\n<meta name="robots" content="noindex,nofollow">/' _site/index.html
          grep -q 'content="noindex,nofollow"' _site/index.html

      # Portfolio thumbnail for justbost.com, regenerated on every deploy so
      # it always matches what's live. Served at ./screenshot.png.
      - name: Capture screenshot.png (1280x800)
        run: |
          npx -y playwright@1.56.0 install --with-deps chromium
          npx -y playwright@1.56.0 screenshot --viewport-size="1280, 800" \
            --wait-for-timeout=2000 "file://$PWD/_site/index.html" _site/screenshot.png
          test -s _site/screenshot.png

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
